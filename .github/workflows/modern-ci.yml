name: Modern CI

on:
  pull_request:
    paths:
      - ".github/workflows/modern-ci.yml"
      - "modern/**"
      - "docker/examples/postgres-demo/**"
      - "Dockerfile"
      - "gradle/**"
      - "gradlew"
  push:
    branches:
      - trunk
    paths:
      - ".github/workflows/modern-ci.yml"
      - "modern/**"
      - "docker/examples/postgres-demo/**"
      - "Dockerfile"
      - "gradle/**"
      - "gradlew"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modern-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Lint backend
        run: ./gradlew -p modern/backend ktlintCheck --no-daemon

      - name: Build backend
        run: ./gradlew -p modern/backend build -x test --no-daemon

  frontend-quality:
    name: Frontend Format, Lint, and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modern/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modern/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

  integration:
    name: Modern Integration Tests
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modern/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: modern/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: modern/web
        run: npx playwright install --with-deps chromium

      - name: Build OFBiz runtime image
        run: docker build --target runtime -t ofbiz-docker .

      - name: Prepare OFBiz PostgreSQL assets
        run: |
          mkdir -p docker/examples/postgres-demo/logs
          chmod 777 docker/examples/postgres-demo/logs
          docker/examples/postgres-demo/fetch-postgres-driver.sh

      - name: Start PostgreSQL-backed stack
        run: docker compose -f docker/examples/postgres-demo/docker-compose.yml up -d --build

      - name: Wait for OFBiz
        run: |
          for i in $(seq 1 90); do
            if curl -skf https://localhost:8443/partymgr/ >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          docker compose -f docker/examples/postgres-demo/docker-compose.yml logs ofbiz
          exit 1

      - name: Load demo data
        run: docker compose -f docker/examples/postgres-demo/docker-compose.yml exec -T ofbiz /ofbiz/bin/ofbiz --load-data readers=seed,seed-initial,demo

      - name: Wait for backend API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker/examples/postgres-demo/docker-compose.yml logs backend
          exit 1

      - name: Run backend tests
        env:
          LEADFLOW_DB_URL: jdbc:postgresql://localhost:55432/ofbizmaindb
          LEADFLOW_DB_USERNAME: ofbiz
          LEADFLOW_DB_PASSWORD: ofbiz
          LEADFLOW_OFBIZ_BASE_URL: https://localhost:8443
        run: ./gradlew -p modern/backend test --no-daemon

      - name: Run frontend end-to-end tests
        working-directory: modern/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: npm run test:e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker/examples/postgres-demo/docker-compose.yml logs

      - name: Stop stack
        if: always()
        run: docker compose -f docker/examples/postgres-demo/docker-compose.yml down -v
