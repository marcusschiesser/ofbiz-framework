name: Migration Order Lifecycle

on:
  pull_request:
    paths:
      - "migration/**"
      - ".github/workflows/migration-order-lifecycle.yml"
  push:
    branches:
      - main
    paths:
      - "migration/**"
      - ".github/workflows/migration-order-lifecycle.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: order_lifecycle
          POSTGRES_USER: order_lifecycle
          POSTGRES_PASSWORD: order_lifecycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_lifecycle -d order_lifecycle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew test
      - run: DB_HOST=localhost DB_PORT=5432 DB_NAME=order_lifecycle DB_USERNAME=order_lifecycle DB_PASSWORD=order_lifecycle ./gradlew integrationTest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: migration/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.0
      - run: helm lint migration/infra/helm/order-lifecycle
      - run: helm template order-lifecycle migration/infra/helm/order-lifecycle > /tmp/order-lifecycle-rendered.yaml

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: order_lifecycle
          POSTGRES_USER: order_lifecycle
          POSTGRES_PASSWORD: order_lifecycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_lifecycle -d order_lifecycle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: migration/frontend/package-lock.json
      - run: npm ci
        working-directory: migration/frontend
      - run: npx playwright install --with-deps
        working-directory: migration/frontend
      - name: Start backend
        run: |
          cd migration/backend
          chmod +x ./gradlew
          DB_HOST=localhost DB_PORT=5432 DB_NAME=order_lifecycle DB_USERNAME=order_lifecycle DB_PASSWORD=order_lifecycle APP_SEED_ENABLED=true APP_SEED_ONLY=false ./gradlew bootRun > /tmp/order-lifecycle-backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/order-lifecycle-backend.log
          exit 1
      - name: Start frontend
        run: |
          cd migration/frontend
          BACKEND_URL=http://localhost:8080 npm run dev -- --hostname 0.0.0.0 > /tmp/order-lifecycle-frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/healthz; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/order-lifecycle-frontend.log
          exit 1
      - run: npm run test:e2e
        working-directory: migration/frontend

  images:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x migration/backend/gradlew
      - run: ./gradlew bootBuildImage --imageName order-lifecycle-backend:${{ github.sha }}
        working-directory: migration/backend
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: migration/frontend/package-lock.json
      - run: npm ci
        working-directory: migration/frontend
      - run: docker build -t order-lifecycle-frontend:${{ github.sha }} migration/frontend
