apiVersion: v1
kind: Service
metadata:
  name: {{ include "order-lifecycle.backendName" . }}
  labels:
    {{- include "order-lifecycle.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "order-lifecycle.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http

