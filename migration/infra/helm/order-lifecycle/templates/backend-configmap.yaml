apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-lifecycle.backendConfigMapName" . }}
  labels:
    {{- include "order-lifecycle.labels" . | nindent 4 }}
data:
  SERVER_PORT: "{{ .Values.backend.containerPort }}"
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: "{{ .Values.database.port }}"
  DB_NAME: {{ .Values.database.name | quote }}
  FRONTEND_ORIGIN: {{ .Values.backend.cors.frontendOrigin | quote }}
  APP_SEED_ENABLED: "false"
  APP_SEED_ONLY: "false"

