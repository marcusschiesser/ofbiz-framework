apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "order-lifecycle.frontendConfigMapName" . }}
  labels:
    {{- include "order-lifecycle.labels" . | nindent 4 }}
data:
  BACKEND_URL: http://{{ include "order-lifecycle.backendName" . }}:{{ .Values.backend.service.port }}
  PORT: "{{ .Values.frontend.containerPort }}"
  NODE_ENV: production

