spring:
  application:
    name: order-lifecycle-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_lifecycle}
    username: ${DB_USERNAME:order_lifecycle}
    password: ${DB_PASSWORD:order_lifecycle}
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
app:
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    only: ${APP_SEED_ONLY:false}
